name: Scan Unity game data

on:
  push:
    branches: [dev-test]
    paths:
      - "Build/ClusterTruckWEB.data.part*"
      - "Build/ClusterTruckWEB.loader.js"
      - "Build/ClusterTruckWEB.framework.js"
      - "tools/scan_unity_data.py"
      - ".github/workflows/unity-data-scan.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-unity-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out dev-test
        uses: actions/checkout@v4

      - name: Join and inspect Unity data
        run: python3 tools/scan_unity_data.py

      - name: Save report on dev-test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unity-data-scan-report.txt
          git commit -m "Add Unity data scan report" || echo "Report unchanged"
          git push origin HEAD:dev-test

      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: clustertruck-unity-data-scan-report
          path: unity-data-scan-report.txt
          if-no-files-found: error
          retention-days: 14
