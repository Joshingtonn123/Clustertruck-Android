<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Clustertruck Android</title>
<!-- Launcher source packaged for the Android WebView APK. -->
<style>
:root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090909;color:#f4f4f4;touch-action:pan-y}
button{font:inherit;color:inherit;border:1px solid #333;background:#191919;border-radius:12px;padding:14px 20px}
#launcher{height:100%;overflow-y:auto;overflow-x:hidden;display:flex;align-items:flex-start;justify-content:center;padding:22px 22px 36px;touch-action:pan-y;-webkit-overflow-scrolling:touch}.panel{flex:0 0 auto;margin:auto 0;min-height:min-content}
.panel{width:min(100%,430px);background:#111;border:1px solid #292929;border-radius:20px;padding:24px;box-shadow:0 18px 60px #0009}
h1{margin:0 0 6px;font-size:30px;letter-spacing:-1px}
.sub{color:#999;font-size:13px;margin-bottom:24px}
#installBtn{width:100%;background:#e8e8e8;color:#111;font-weight:800;font-size:17px;border:0;padding:17px}
#progressWrap{height:5px;background:#292929;border-radius:8px;margin-top:14px;overflow:hidden;display:none}
#progress{height:100%;width:0;background:#e8e8e8}
#status{font-size:12px;color:#999;margin-top:9px;min-height:16px}
.section{border-top:1px solid #292929;margin-top:24px;padding-top:18px}.setting select{background:#191919;color:#eee;border:1px solid #444;border-radius:8px;padding:8px}.setting input[type=range]{width:48%;accent-color:#e34b4b}.setting button.action{padding:9px 12px;border-radius:8px;font-size:13px}
.sectionTitle{font-size:12px;color:#888;letter-spacing:1.5px;font-weight:700;margin-bottom:14px}
.setting{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.setting span{font-size:14px}
.switch{width:48px;height:28px;padding:3px;border:0;border-radius:20px;background:#444;transition:.15s}
.switch:after{content:"";display:block;width:22px;height:22px;border-radius:50%;background:white;transition:.15s}
.switch.on{background:#e34b4b}
.switch.on:after{transform:translateX(20px)}
#game{display:none;position:fixed;inset:0;background:#000;align-items:center;justify-content:center;overflow:hidden}
#unity-canvas{display:block;outline:0;flex:none;max-width:100vw;max-height:100vh}
#fps{display:none;position:absolute;left:10px;top:8px;color:#f22;font-family:Arial,sans-serif;font-size:15px;font-weight:700;z-index:20;pointer-events:none;text-shadow:0 1px 2px #000}
#gameError{display:none;position:absolute;left:5%;right:5%;top:40%;padding:16px;background:#211;border:1px solid #933;color:#faa;z-index:40;font-size:13px}
#controls{display:none;position:absolute;inset:0;pointer-events:none;z-index:15}
.stick{position:absolute;width:116px;height:116px;border:2px solid #ffffff66;background:#1117;border-radius:50%;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center}
.stick .nub{width:46px;height:46px;border-radius:50%;background:#ffffff55;border:1px solid #ffffff99}
#leftStick,#rightStick{left:0;top:0;bottom:auto;right:auto;width:140px;height:140px;transform:translate(-50%,-50%)}
#buttons{position:absolute;inset:0;width:auto;height:auto;pointer-events:none}
.pad{position:absolute;left:0;top:0;width:64px;height:64px;padding:0;border-radius:50%;background:#151515bb;border:1px solid #ffffff99;font-weight:800;font-size:16px;pointer-events:auto;touch-action:none;box-shadow:0 2px 8px #0008;transform:translate(-50%,-50%)}
.pad.active{background:#b52b2b;color:white}.gyro-hidden{display:none!important}
#btnA,#btnRT,#btnLT,#btnRB,#btnLB,#dpadUp,#dpadDown,#dpadLeft,#dpadRight{right:auto;bottom:auto}
.dpad{display:none;font-size:22px}
#btnBack{top:auto!important;left:42%!important;right:auto!important;bottom:10px!important}#btnStart{top:auto!important;left:52%!important;right:auto!important;bottom:10px!important}
#leftStick{left:8%;top:76%}#rightStick{left:68%;top:76%}
#btnRB{left:92%;top:28%}#btnRT{left:92%;top:10%}#btnLT{left:8%;top:10%}#btnLB{left:8%;top:28%}#btnA{left:92%;top:58%}#btnB{left:84%;top:69%}#btnX{left:84%;top:47%}#btnY{left:76%;top:58%}
#exit,#btnBack,#btnStart{position:absolute;top:10px;z-index:25;pointer-events:auto;background:#111b;padding:7px 11px;font-size:12px}#controlsVisibility{position:absolute;right:12px;bottom:12px;z-index:26;pointer-events:auto;background:#111d;border:1px solid #ffffff88;border-radius:10px;padding:9px 13px;font-size:12px;font-weight:800}#exit{right:10px}#btnStart{right:74px}#btnBack{right:138px}
@media(max-width:520px){.stick{width:112px;height:112px}.pad{width:54px;height:54px;font-size:13px}}
</style>
</head>
<body>
<div id="launcher">
 <main class="panel">
  <h1>CLUSTERTRUCK</h1>
  <div class="sub">ANDROID LAUNCHER</div>
  <button id="installBtn">INSTALL</button>
  <div id="progressWrap"><div id="progress"></div></div>
  <div id="status">Game files are downloaded once and kept in this browser's storage.</div>
  <div class="section">
   <div class="sectionTitle">SETTINGS</div>
   <div class="setting"><span>Show FPS counter</span><button class="switch" id="fpsToggle" role="switch" aria-checked="false" aria-label="Show FPS counter"></button></div>
   <div class="setting"><span>Game resolution</span><select id="gameResolution"><option>600x400</option><option>800x600</option><option selected>1600x720</option><option>1248x720</option></select></div>
   <div class="setting"><span>Graphics resolution <b id="scaleValue">100%</b></span><input id="renderScale" type="range" min="10" max="100" step="5" value="100"></div>
   <div class="setting"><span>Stretch game screen</span><button class="switch" id="stretchToggle" role="switch" aria-checked="false" aria-label="Stretch game screen"></button></div>
   <div class="setting"><span>Gyro camera</span><button class="switch" id="gyroToggle" role="switch" aria-checked="false" aria-label="Gyro camera"></button></div>
   <div class="setting"><span>Gyro sensitivity <b id="gyroSensitivityValue">2.0x</b></span><input id="gyroSensitivity" type="range" min="0.2" max="6" step="0.2" value="2"></div>
   <div class="setting"><span>Touch controls</span><button class="action" id="customizeBtn">CUSTOMIZE</button></div>
  </div>
 </main>
</div>
<div id="game">
 <canvas id="unity-canvas" tabindex="-1"></canvas>
 <div id="fps">FPS: --</div>
 <button id="btnBack">BACK</button><button id="btnStart">START</button><button id="exit">EXIT</button><button id="controlsVisibility" aria-label="Hide touch controls">HIDE</button>
 <div id="controls">
  <div class="stick" id="leftStick"><div class="nub"></div></div>
  <div class="stick" id="rightStick"><div class="nub"></div></div>
  <div id="buttons">
   <button class="pad" id="btnLT">LT</button>
   <button class="pad" id="btnRT">RT</button>
   <button class="pad dpad" id="dpadUp">▲</button><button class="pad dpad" id="dpadDown">▼</button><button class="pad dpad" id="dpadLeft">◀</button><button class="pad dpad" id="dpadRight">▶</button>
   <button class="pad" id="btnA">A</button><button class="pad" id="btnB">B</button><button class="pad" id="btnX">X</button><button class="pad" id="btnY">Y</button>
   <button class="pad" id="btnRB">RB</button>
   <button class="pad" id="btnLB">LB</button>
  </div>
 </div>
 <div id="gameError"></div>
</div>
<div id="editor" style="display:none;position:fixed;inset:0;background:#000;z-index:100;overflow:hidden">
 <div style="position:absolute;left:16px;top:14px;right:16px;display:flex;align-items:center;justify-content:space-between;z-index:3">
  <button id="editorBack">BACK</button><b>MOVE CONTROLS</b><button id="editorSave">SAVE</button>
 </div>
 <div id="editorItems" style="position:absolute;inset:0"></div>
 <div id="editorTools" style="position:absolute;left:12px;right:12px;top:64px;bottom:auto;padding:12px;background:#151515ee;border:1px solid #444;border-radius:12px;z-index:4;display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap">
  <label>Size <input id="editSize" type="range" min="40" max="220" value="64"></label>
  <label>Opacity <input id="editOpacity" type="range" min="10" max="100" value="75"></label>
  <button id="editReset">RESET</button>
 </div>
</div>
<script>
const BASE="Build/";
const DB_NAME="clustertruck-android-install";
const DB_VERSION=1;
const ASSETS=[
 {id:"data",url:BASE+"ClusterTruckWEB.data",mime:"application/octet-stream"},
 {id:"wasm",url:BASE+"ClusterTruckWEB.wasm",mime:"application/wasm"},
 {id:"loader",url:BASE+"ClusterTruckWEB.loader.js",mime:"text/javascript"},
 {id:"framework",url:BASE+"ClusterTruckWEB.framework.js",mime:"text/javascript"}
];
const $=id=>document.getElementById(id);
let db=null,unityInstance=null,installed=false,rtOn=false,fpsEnabled=localStorage.getItem("ct-fps")==="1";
let resolution=localStorage.getItem("ct-resolution")||"1600x720";
let renderScale=Number(localStorage.getItem("ct-render-scale")||100);
let stretchScreen=localStorage.getItem("ct-stretch")==="1";
const controlDefaults={"leftStick":{x:14,y:76,size:140,opacity:75},"rightStick":{x:78,y:76,size:140,opacity:75},"btnLT":{x:8,y:10,size:64,opacity:75},"btnLB":{x:8,y:28,size:64,opacity:75},"btnRT":{x:92,y:10,size:64,opacity:75},"btnRB":{x:92,y:28,size:64,opacity:75},"btnA":{x:92,y:58,size:64,opacity:75},"btnB":{x:84,y:69,size:64,opacity:75},"btnX":{x:84,y:47,size:64,opacity:75},"btnY":{x:76,y:58,size:64,opacity:75},"btnBack":{x:42,y:91,size:58,opacity:75},"btnStart":{x:52,y:91,size:58,opacity:75}};
let controlLayout=JSON.parse(localStorage.getItem("ct-controls-v2")||"null")||JSON.parse(JSON.stringify(controlDefaults));
if(controlLayout.btnLB&&controlLayout.btnLB.y===21)controlLayout.btnLB.y=28;
if(controlLayout.btnRB&&controlLayout.btnRB.y===21)controlLayout.btnRB.y=28;
let gyroEnabled=false,gyroBase=null,gyroLast=0,gyroSensitivity=Number(localStorage.getItem("ct-gyro-sensitivity")||2),controlsVisible=true;
function applyControlLayout(){
 for(const [id,p] of Object.entries(controlLayout)){
  const el=$(id); if(!el) continue;
  el.style.left=p.x+"%"; el.style.top=p.y+"%";
  el.style.right="auto"; el.style.bottom="auto";
  el.style.width=p.size+"px"; el.style.height=p.size+"px";
  el.style.opacity=p.opacity/100;
  if(id.endsWith("Stick")){const nub=el.querySelector(".nub");if(nub){nub.style.width=Math.max(30,p.size*.34)+"px";nub.style.height=Math.max(30,p.size*.34)+"px";}}
 }
}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains("files"))req.result.createObjectStore("files",{keyPath:"key"});if(!req.result.objectStoreNames.contains("meta"))req.result.createObjectStore("meta",{keyPath:"key"});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function put(store,value){return new Promise((resolve,reject)=>{const tx=db.transaction(store,"readwrite");tx.objectStore(store).put(value);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
function get(store,key){return new Promise((resolve,reject)=>{const req=db.transaction(store).objectStore(store).get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function setStatus(s){$("status").textContent=s;}
function setProgress(p){$("progressWrap").style.display="block";$("progress").style.width=Math.max(0,Math.min(100,p))+"%";}
async function discover(url){const parts=[];for(let i=1;i<=128;i++){const r=await fetch(url+".part"+i,{method:"HEAD"});if(!r.ok)break;parts.push({url:url+".part"+i,size:Number(r.headers.get("content-length"))||0});}return parts;}
async function fetchBuffer(url){const r=await fetch(url);if(!r.ok)throw new Error("Download failed ("+r.status+"): "+url);return await r.arrayBuffer();}
async function installAsset(asset,progress){
 const parts=(asset.id==="data"||asset.id==="wasm")?await discover(asset.url):[];
 if(parts.length){
  await put("meta",{key:asset.id,parts:parts.length,mime:asset.mime});
  for(let i=0;i<parts.length;i++){const b=await fetchBuffer(parts[i].url);await put("files",{key:asset.id+":"+i,buffer:b});progress(b.byteLength,parts[i].url.split("/").pop());}
 }else{
  const b=await fetchBuffer(asset.url);await put("meta",{key:asset.id,parts:1,mime:asset.mime,direct:true});await put("files",{key:asset.id+":0",buffer:b});progress(b.byteLength,asset.url.split("/").pop());
 }
}
async function install(){
 $("installBtn").disabled=true;$("installBtn").textContent="INSTALLING…";
 try{
  db=await openDB();
  if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist();
  let loaded=0,total=0;
  for(const a of ASSETS){if(a.id==="loader"||a.id==="framework"){const r=await fetch(a.url,{method:"HEAD"});total+=Number(r.headers.get("content-length"))||1;}else{const p=await discover(a.url);if(p.length)total+=p.reduce((n,x)=>n+x.size,0);else{const r=await fetch(a.url,{method:"HEAD"});total+=Number(r.headers.get("content-length"))||1;}}}
  for(const a of ASSETS){setStatus("Downloading "+a.id+"…");await installAsset(a,(bytes)=>{loaded+=bytes;setProgress(total?loaded/total*100:0);});}
  await put("meta",{key:"installed",value:true});
  installed=true;$("installBtn").textContent="PLAY";setStatus("Installation complete. Your files are saved on this device.");$("progress").style.width="100%";
 }catch(e){console.error(e);setStatus("Install failed: "+e.message);$("installBtn").textContent="RETRY INSTALL";}finally{$("installBtn").disabled=false;}
}
async function readAsset(id){const meta=await get("meta",id);if(!meta)throw new Error("Missing installed file: "+id);const buffers=[];for(let i=0;i<meta.parts;i++){const row=await get("files",id+":"+i);if(!row)throw new Error("Missing part "+(i+1)+" of "+id);buffers.push(row.buffer);}return new Blob(buffers,{type:meta.mime});}
async function play(){
 $("launcher").style.display="none";$("game").style.display="flex";$("controls").style.display="block";$("fps").style.display=fpsEnabled?"block":"none";$("unity-canvas").focus();
 try{
  db=db||await openDB();
  const [data,wasm,loader,framework]=await Promise.all([readAsset("data"),readAsset("wasm"),readAsset("loader"),readAsset("framework")]);
  const dataUrl=URL.createObjectURL(data),wasmUrl=URL.createObjectURL(wasm),loaderUrl=URL.createObjectURL(loader),frameworkUrl=URL.createObjectURL(framework);
  const script=document.createElement("script");script.src=loaderUrl;
  const [baseW,baseH]=resolution.split("x").map(Number);
  const canvas=$("unity-canvas");
  canvas.addEventListener("pointerdown",focusGame);
  resizeCanvasBuffer();
  applyCanvasDisplay();
  await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=()=>reject(new Error("Unity loader could not start"));document.body.appendChild(script);});
  unityInstance=await createUnityInstance($("unity-canvas"),{dataUrl,codeUrl:wasmUrl,frameworkUrl,streamingAssetsUrl:BASE,companyName:"Landfall",productName:"Clustertruck",productVersion:"1.0",matchWebGLToCanvasSize:false,webglContextAttributes:{antialias:false,alpha:false,preserveDrawingBuffer:false,powerPreference:"high-performance"}},p=>setStatus("Starting game… "+Math.round(p*100)+"%"));
  setTimeout(()=>{URL.revokeObjectURL(dataUrl);URL.revokeObjectURL(wasmUrl);URL.revokeObjectURL(loaderUrl);URL.revokeObjectURL(frameworkUrl);},5000);
  startFPS();
 }catch(e){console.error(e);$("gameError").style.display="block";$("gameError").textContent="Could not start the game: "+e.message;}
}
function focusGame(){const c=$("unity-canvas");if(c) c.focus({preventScroll:true});}
function key(code,down){focusGame();const type=down?"keydown":"keyup",k=({Space:" ",ShiftLeft:"Shift",Escape:"Escape",Enter:"Enter",ArrowUp:"ArrowUp",ArrowDown:"ArrowDown",ArrowLeft:"ArrowLeft",ArrowRight:"ArrowRight"})[code]||code.replace("Key","").toLowerCase();const ev=()=>new KeyboardEvent(type,{key:k,code,bubbles:true,cancelable:true});window.dispatchEvent(ev());document.dispatchEvent(ev());$("unity-canvas").dispatchEvent(ev());}
function mouse(button,down){const type=down?"mousedown":"mouseup",x=innerWidth/2,y=innerHeight/2;const make=()=>new MouseEvent(type,{button,bubbles:true,cancelable:true,clientX:x,clientY:y});window.dispatchEvent(make());document.dispatchEvent(make());$("unity-canvas").dispatchEvent(make());}
function bindPad(id,down,up){const el=$(id);el.addEventListener("pointerdown",e=>{e.preventDefault();focusGame();el.setPointerCapture(e.pointerId);el.classList.add("active");down();});const release=e=>{el.classList.remove("active");up();};el.addEventListener("pointerup",release);el.addEventListener("pointercancel",release);el.addEventListener("lostpointercapture",release);}
bindPad("btnA",()=>{key("Space",true);key("Enter",true);},()=>{key("Space",false);key("Enter",false);});

bindPad("btnRB",()=>mouse(2,true),()=>mouse(2,false));
bindPad("btnB",()=>key("Escape",true),()=>key("Escape",false));
bindPad("btnX",()=>mouse(0,true),()=>mouse(0,false));
bindPad("btnY",()=>key("KeyQ",true),()=>key("KeyQ",false));
bindPad("btnLB",()=>key("KeyE",true),()=>key("KeyE",false));
bindPad("btnLT",()=>key("ControlLeft",true),()=>key("ControlLeft",false));
bindPad("dpadUp",()=>key("ArrowUp",true),()=>key("ArrowUp",false));
bindPad("dpadDown",()=>key("ArrowDown",true),()=>key("ArrowDown",false));
bindPad("dpadLeft",()=>key("ArrowLeft",true),()=>key("ArrowLeft",false));
bindPad("dpadRight",()=>key("ArrowRight",true),()=>key("ArrowRight",false));
bindPad("btnBack",()=>key("Escape",true),()=>key("Escape",false));
bindPad("btnStart",()=>key("Enter",true),()=>key("Enter",false));
$("btnRT").addEventListener("pointerdown",e=>{e.preventDefault();rtOn=!rtOn;$("btnRT").classList.toggle("active",rtOn);key("ShiftLeft",rtOn);});
function bindStick(id,kind){const el=$(id),nub=el.querySelector(".nub");let pointer=null,lastX=0,lastY=0,keys=new Set();function release(){keys.forEach(k=>key(k,false));keys.clear();pointer=null;nub.style.transform="translate(0,0)";}
 el.addEventListener("pointerdown",e=>{e.preventDefault();focusGame();pointer=e.pointerId;el.setPointerCapture(pointer);lastX=e.clientX;lastY=e.clientY;});
 el.addEventListener("pointermove",e=>{if(pointer!==e.pointerId)return;const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width*.32,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max;}nub.style.transform="translate("+dx+"px,"+dy+"px)";
 if(kind==="move"){const next=new Set();if(dy< -18){next.add("KeyW");next.add("ArrowUp");}if(dy>18){next.add("KeyS");next.add("ArrowDown");}if(dx< -18){next.add("KeyA");next.add("ArrowLeft");}if(dx>18){next.add("KeyD");next.add("ArrowRight");}keys.forEach(k=>{if(!next.has(k))key(k,false);});next.forEach(k=>{if(!keys.has(k))key(k,true);});keys=next;}
 else {const mx=e.clientX-lastX,my=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;$("unity-canvas").dispatchEvent(new MouseEvent("mousemove",{movementX:mx,movementY:my,clientX:e.clientX,clientY:e.clientY,bubbles:true}));}
 });
 el.addEventListener("pointerup",release);el.addEventListener("pointercancel",release);el.addEventListener("lostpointercapture",release);
}
bindStick("leftStick","move");bindStick("rightStick","look");applyControlLayout();
function setGyro(v){gyroEnabled=v;const sw=$("gyroToggle");sw.classList.toggle("on",v);sw.setAttribute("aria-checked",String(v));$("rightStick").classList.toggle("gyro-hidden",v);gyroBase=null;gyroLast=0;if(v){if(!("DeviceOrientationEvent" in window)){setGyro(false);alert("Gyroscope sensors are not available in this browser.");return;}const start=()=>{window.addEventListener("deviceorientation",onGyro,{passive:true});};if(typeof DeviceOrientationEvent.requestPermission==="function"){DeviceOrientationEvent.requestPermission().then(x=>{if(x==="granted")start();else setGyro(false);}).catch(()=>setGyro(false));}else start();}else window.removeEventListener("deviceorientation",onGyro);}
function angleDelta(a,b){let d=a-b;while(d>180)d-=360;while(d< -180)d+=360;return d;}
function onGyro(e){if(!gyroEnabled||e.gamma==null||e.beta==null)return;const now=performance.now();if(now-gyroLast<16)return;gyroLast=now;const angle=(screen.orientation&&typeof screen.orientation.angle==="number")?screen.orientation.angle:0;let gx=e.gamma,by=e.beta;if(angle===90){gx=e.beta;by=-e.gamma;}else if(angle===270){gx=-e.beta;by=e.gamma;}if(!gyroBase){gyroBase={gamma:gx,beta:by};return;}let dx=angleDelta(gx,gyroBase.gamma),dy=angleDelta(by,gyroBase.beta);gyroBase={gamma:gx,beta:by};if(Math.abs(dx)<0.55)dx=0;if(Math.abs(dy)<0.55)dy=0;const mx=Math.max(-12,Math.min(12,-dx*gyroSensitivity)),my=Math.max(-12,Math.min(12,-dy*gyroSensitivity));if(!mx&&!my)return;const x=innerWidth/2,y=innerHeight/2;const ev=new MouseEvent("mousemove",{bubbles:true,cancelable:true,clientX:x,clientY:y,movementX:mx,movementY:my});window.dispatchEvent(ev);document.dispatchEvent(ev);$("unity-canvas").dispatchEvent(ev);}
window.addEventListener("orientationchange",()=>{gyroBase=null;});
$("gyroToggle").addEventListener("click",()=>setGyro(!gyroEnabled));
$("gyroSensitivity").value=gyroSensitivity;$("gyroSensitivityValue").textContent=gyroSensitivity.toFixed(1)+"x";
$("gyroSensitivity").addEventListener("input",e=>{gyroSensitivity=Number(e.target.value);$("gyroSensitivityValue").textContent=gyroSensitivity.toFixed(1)+"x";localStorage.setItem("ct-gyro-sensitivity",String(gyroSensitivity));});
function setControlsVisible(v){controlsVisible=v;$("controls").style.display=v?"block":"none";$("btnBack").style.display=v?"block":"none";$("btnStart").style.display=v?"block":"none";$("controlsVisibility").textContent=v?"HIDE":"SHOW";$("controlsVisibility").setAttribute("aria-label",v?"Hide touch controls":"Show touch controls");}
$("controlsVisibility").addEventListener("click",()=>setControlsVisible(!controlsVisible));
window.addEventListener("resize",applyCanvasDisplay);
let fpsLoopRunning=false;function startFPS(){if(fpsLoopRunning||!fpsEnabled)return;fpsLoopRunning=true;let last=performance.now(),frames=0;function tick(now){if(!fpsEnabled){fpsLoopRunning=false;return;}frames++;if(now-last>=1000){$("fps").textContent="FPS: "+Math.round(frames*1000/(now-last));frames=0;last=now;}requestAnimationFrame(tick);}requestAnimationFrame(tick);}
function resizeCanvasBuffer(){const c=$("unity-canvas");if(!c)return;const [w,h]=resolution.split("x").map(Number);const scale=Math.max(0.1,Math.min(1,renderScale/100));const nw=Math.max(1,Math.round(w*scale)),nh=Math.max(1,Math.round(h*scale));if(c.width!==nw)c.width=nw;if(c.height!==nh)c.height=nh;}
function applyCanvasDisplay(){const c=$("unity-canvas");if(!c)return;const [w,h]=resolution.split("x").map(Number);if(stretchScreen){c.style.width="100vw";c.style.height="100vh";}else{const scale=Math.min(innerWidth/w,innerHeight/h);c.style.width=Math.floor(w*scale)+"px";c.style.height=Math.floor(h*scale)+"px";}c.style.objectFit="fill";}
function setStretch(v){stretchScreen=v;localStorage.setItem("ct-stretch",v?"1":"0");$("stretchToggle").classList.toggle("on",v);$("stretchToggle").setAttribute("aria-checked",String(v));if($("game").style.display==="flex")applyCanvasDisplay();}
function setFPS(v){fpsEnabled=v;localStorage.setItem("ct-fps",v?"1":"0");$("fpsToggle").classList.toggle("on",v);$("fpsToggle").setAttribute("aria-checked",String(v));if($("game").style.display==="flex"){$("fps").style.display=v?"block":"none";if(v)startFPS();}}
$("fpsToggle").addEventListener("click",()=>setFPS(!fpsEnabled));setFPS(fpsEnabled);
$("gameResolution").value=resolution;$("renderScale").value=renderScale;$("scaleValue").textContent=renderScale+"%";
$("gameResolution").addEventListener("change",e=>{resolution=e.target.value;localStorage.setItem("ct-resolution",resolution);resizeCanvasBuffer();applyCanvasDisplay();});
$("renderScale").addEventListener("input",e=>{renderScale=Number(e.target.value);$("scaleValue").textContent=renderScale+"%";localStorage.setItem("ct-render-scale",String(renderScale));resizeCanvasBuffer();});
$("stretchToggle").addEventListener("click",()=>setStretch(!stretchScreen));setStretch(stretchScreen);
function openEditor(){
 const editor=$("editor"),items=$("editorItems");items.innerHTML="";editor.style.display="block";
 for(const id of Object.keys(controlDefaults)){const p=controlLayout[id],el=document.createElement("div");el.className="editControl";el.dataset.id=id;el.textContent=id.endsWith("Stick")? (id==="leftStick"?"LEFT STICK":"RIGHT STICK"):id.replace("btn","");el.style.cssText="position:absolute;left:"+p.x+"%;top:"+p.y+"%;width:"+p.size+"px;height:"+p.size+"px;transform:translate(-50%,-50%);border:2px solid #fff9;border-radius:"+(id.endsWith("Stick")?"50%":"50%")+";background:#ffffff22;display:flex;align-items:center;justify-content:center;font-weight:bold;touch-action:none;opacity:"+(p.opacity/100)+";";items.appendChild(el);
  el.addEventListener("pointerdown",e=>{e.preventDefault();selectedControl=id;document.querySelectorAll(".editControl").forEach(n=>n.style.outline="none");el.style.outline="2px solid #e34b4b";$("editSize").value=controlLayout[id].size;$("editOpacity").value=controlLayout[id].opacity;el.setPointerCapture(e.pointerId);dragPointer=e.pointerId;});
  el.addEventListener("pointermove",e=>{if(dragPointer!==e.pointerId)return;const x=Math.max(3,Math.min(97,e.clientX/innerWidth*100)),y=Math.max(8,Math.min(92,e.clientY/innerHeight*100));controlLayout[id].x=x;controlLayout[id].y=y;el.style.left=x+"%";el.style.top=y+"%";});
  el.addEventListener("pointerup",()=>dragPointer=null);el.addEventListener("pointercancel",()=>dragPointer=null);
 }
}
let selectedControl=null,dragPointer=null;
$("customizeBtn").addEventListener("click",openEditor);
$("editorBack").addEventListener("click",()=>{$("editor").style.display="none";});
$("editorSave").addEventListener("click",()=>{localStorage.setItem("ct-controls-v2",JSON.stringify(controlLayout));applyControlLayout();$("editor").style.display="none";});
$("editSize").addEventListener("input",e=>{if(!selectedControl)return;controlLayout[selectedControl].size=Number(e.target.value);const el=document.querySelector('.editControl[data-id="'+selectedControl+'"]');if(el){el.style.width=e.target.value+"px";el.style.height=e.target.value+"px";}});
$("editOpacity").addEventListener("input",e=>{if(!selectedControl)return;controlLayout[selectedControl].opacity=Number(e.target.value);const el=document.querySelector('.editControl[data-id="'+selectedControl+'"]');if(el)el.style.opacity=String(Number(e.target.value)/100);});
$("editReset").addEventListener("click",()=>{controlLayout=JSON.parse(JSON.stringify(controlDefaults));openEditor();});
$("installBtn").addEventListener("click",async()=>{if(installed){play();return;}db=await openDB();const m=await get("meta","installed");if(m&&m.value){installed=true;play();}else install();});
$("exit").addEventListener("click",()=>{if(unityInstance&&unityInstance.Quit)unityInstance.Quit();unityInstance=null;$("game").style.display="none";$("launcher").style.display="flex";if(rtOn)key("ShiftLeft",false);rtOn=false;$("btnRT").classList.remove("active");});
(async()=>{try{db=await openDB();const m=await get("meta","installed");if(m&&m.value){installed=true;$("installBtn").textContent="PLAY";setStatus("Already installed. Your game files are saved on this device.");}}catch(e){setStatus("Browser storage unavailable: "+e.message);}})();
</script>
</body>
</html>
